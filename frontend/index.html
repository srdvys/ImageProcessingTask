<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обробка фото</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 25px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #f9fafb;
            color: #374151;
            cursor: pointer;
        }

            input[type="file"]::file-selector-button {
                border: none;
                background: #e5e7eb;
                padding: 8px 12px;
                border-radius: 6px;
                color: #374151;
                cursor: pointer;
                margin-right: 10px;
                transition: background 0.2s;
            }

                input[type="file"]::file-selector-button:hover {
                    background: #d1d5db;
                }

            select:focus, input[type="file"]:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

            button:hover {
                background-color: #2563eb;
            }

            button:active {
                transform: scale(0.98);
            }

        #progress-wrapper {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 8px;
            margin-top: 25px;
            display: none;
            overflow: hidden;
            height: 24px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #10b981;
            text-align: center;
            line-height: 24px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            transition: width 0.4s ease;
        }

        #cancel-btn {
            background-color: #ef4444;
            margin-top: 15px;
            display: none;
        }

            #cancel-btn:hover {
                background-color: #dc2626;
            }

        #result-image {
            max-width: 100%;
            margin-top: 25px;
            display: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h2>Завантажити фотографію</h2>
        <form id="uploadForm">
            <input type="file" id="imageInput" name="file" required accept="image/*">

            <select name="filterType">
                <option value="grayscale">Чорно-білий</option>
                <option value="negative">Негатив</option>
                <option value="sepia">Сепія</option>
                <option value="red">Червоний відтінок</option>
                <option value="blue">Синій відтінок</option>
            </select>

            <button type="submit">Відправити фото</button>
        </form>

        <div id="progress-wrapper">
            <div id="progress-bar">0%</div>
        </div>

        <button type="button" id="cancel-btn">Скасувати задачу</button>

        <img id="result-image" alt="Оброблено" />
    </div>

    <script>
                function generateUUID() {
                    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }

                let currentTaskId = null;

                document.getElementById("cancel-btn").onclick = async () => {
                    if (!currentTaskId) return;
                    await fetch(`http://localhost:5000/api/image/cancel/${currentTaskId}`, { method: 'POST' });
                    document.getElementById("cancel-btn").style.display = "none";
                };

                document.getElementById("uploadForm").onsubmit = async (e) => {
                    e.preventDefault();

                    const fileInput = document.getElementById('imageInput');
                    if (fileInput.files.length > 0) {
                        const fileSize = fileInput.files[0].size / 1024 / 1024;
                        if (fileSize > 5) {
                            alert("Відмова у виконанні: Розмір файлу перевищує ліміт у 5 МБ.");
                            return;
                        }
                    }

                    const formData = new FormData(e.target);
                    const taskId = generateUUID();
                    currentTaskId = taskId;
                    formData.append("taskId", taskId);

                    document.getElementById("progress-wrapper").style.display = "block";
                    document.getElementById("progress-bar").style.width = "0%";
                    document.getElementById("progress-bar").innerText = "0%";
                    document.getElementById("progress-bar").style.backgroundColor = "#10b981"; 
                    document.getElementById("result-image").style.display = "none";
                    document.getElementById("cancel-btn").style.display = "block"; 

                    checkProgress(taskId);

                    try {
                        await fetch("http://localhost:5000/api/image", {
                            method: "POST",
                            body: formData
                        });
                    } catch (err) {
                        console.error("Помилка:", err);
                    }
                };

                async function checkProgress(taskId) {
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(`http://localhost:5000/api/image/status/${taskId}`);

                            if (!res.ok) return;

                            const statusData = await res.json();

                            if (statusData.status === "Cancelled") {
                                clearInterval(interval);
                                document.getElementById("progress-bar").style.width = "100%";
                                document.getElementById("progress-bar").innerText = "Скасовано";
                                document.getElementById("progress-bar").style.backgroundColor = "#ef4444"; 
                                document.getElementById("cancel-btn").style.display = "none";
                                return;
                            }

                            document.getElementById("progress-bar").style.width = statusData.progress + "%";
                            document.getElementById("progress-bar").innerText = statusData.progress + "%";

                            if (statusData.progress >= 100 && statusData.resultUrl) {
                                clearInterval(interval);
                                document.getElementById("cancel-btn").style.display = "none";
                                document.getElementById("result-image").src = "http://localhost:5000" + statusData.resultUrl;
                                document.getElementById("result-image").style.display = "block";
                            }
                        } catch (err) {
                            console.error("Помилка з'єднання:", err);
                        }
                    }, 500);
                }
    </script>
</body>
</html>
