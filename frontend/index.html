<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обробка фото</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .main-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 25px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #f9fafb;
            color: #374151;
            cursor: pointer;
        }

            input[type="file"]::file-selector-button {
                border: none;
                background: #e5e7eb;
                padding: 8px 12px;
                border-radius: 6px;
                color: #374151;
                cursor: pointer;
                margin-right: 10px;
                transition: background 0.2s;
            }

                input[type="file"]::file-selector-button:hover {
                    background: #d1d5db;
                }

            select:focus, input[type="file"]:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

            button:hover {
                background-color: #2563eb;
            }

            button:active {
                transform: scale(0.98);
            }

        #progress-wrapper {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 8px;
            margin-top: 25px;
            display: none;
            overflow: hidden;
            height: 24px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #10b981;
            text-align: center;
            line-height: 24px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            transition: width 0.4s ease;
        }

        #cancel-btn {
            background-color: #ef4444;
            margin-top: 15px;
            display: none;
        }

            #cancel-btn:hover {
                background-color: #dc2626;
            }

        #result-image {
            max-width: 100%;
            margin-top: 25px;
            display: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .history-section {
            margin-top: 40px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
            text-align: left;
        }

            .history-section h3 {
                font-size: 20px;
                color: #1a1a1a;
                margin-bottom: 15px;
                text-align: center;
            }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-card {
            display: flex;
            align-items: center;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s;
        }

            .history-card:hover {
                box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            }

        .history-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            background-color: #e5e7eb;
        }

        .history-info {
            display: flex;
            flex-direction: column;
        }

        .history-filename {
            font-weight: 600;
            font-size: 14px;
            color: #374151;
            margin-bottom: 4px;
        }

        .history-date {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h2>Завантажити фотографію</h2>
        <form id="uploadForm">
            <input type="file" id="imageInput" name="file" required accept="image/*">

            <select name="filterType">
                <option value="grayscale">Чорно-білий</option>
                <option value="negative">Негатив</option>
                <option value="sepia">Сепія</option>
                <option value="red">Червоний відтінок</option>
                <option value="blue">Синій відтінок</option>
            </select>

            <button type="submit">Відправити фото</button>
        </form>

        <div id="progress-wrapper">
            <div id="progress-bar">0%</div>
        </div>

        <button type="button" id="cancel-btn">Скасувати задачу</button>

        <img id="result-image" alt="Оброблено" />

        <div class="history-section">
            <h3>Історія обробок</h3>
            <div class="history-list" id="history-container">
            </div>
        </div>
    </div>

    <script>
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0,
                    v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        let currentTaskId = null;
        let progressInterval = null;

        document.getElementById("cancel-btn").onclick = async () => {
            if (!currentTaskId) return;
            await fetch(`http://localhost:5000/api/image/cancel/${currentTaskId}`, { method: 'POST' });
            document.getElementById("cancel-btn").style.display = "none";
        };

        document.getElementById("uploadForm").onsubmit = async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length > 0) {
                const fileSize = fileInput.files[0].size / 1024 / 1024;
                if (fileSize > 5) {
                    alert("Відмова у виконанні: Розмір файлу перевищує ліміт у 5 МБ.");
                    return;
                }
            }

            const formData = new FormData(e.target);
            const taskId = generateUUID();
            currentTaskId = taskId;
            formData.append("taskId", taskId);

            document.getElementById("progress-wrapper").style.display = "block";
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("progress-bar").innerText = "0%";
            document.getElementById("progress-bar").style.backgroundColor = "#10b981";
            document.getElementById("result-image").style.display = "none";
            document.getElementById("cancel-btn").style.display = "block";

            checkProgress(taskId);

            try {
                const response = await fetch("http://localhost:5000/api/image", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const errorMessage = await response.text();
                    clearInterval(progressInterval);
                    document.getElementById("progress-wrapper").style.display = "none";
                    document.getElementById("cancel-btn").style.display = "none";
                    alert("Увага: " + errorMessage);
                    return;
                }
            } catch (err) {
                console.error("Помилка:", err);
                clearInterval(progressInterval);
            }
        };

        async function checkProgress(taskId) {
            progressInterval = setInterval(async () => {
                try {
                    const res = await fetch(`http://localhost:5000/api/image/status/${taskId}`);

                    if (!res.ok) return;

                    const statusData = await res.json();

                    if (statusData.status === "Cancelled") {
                        clearInterval(progressInterval);
                        document.getElementById("progress-bar").style.width = "100%";
                        document.getElementById("progress-bar").innerText = "Скасовано";
                        document.getElementById("progress-bar").style.backgroundColor = "#ef4444";
                        document.getElementById("cancel-btn").style.display = "none";
                        return;
                    }

                    document.getElementById("progress-bar").style.width = statusData.progress + "%";
                    document.getElementById("progress-bar").innerText = statusData.progress + "%";

                    if (statusData.progress >= 100 && statusData.resultUrl) {
                        clearInterval(progressInterval);
                        document.getElementById("cancel-btn").style.display = "none";
                        document.getElementById("result-image").src = "http://localhost:5000" + statusData.resultUrl;
                        document.getElementById("result-image").style.display = "block";

                        loadHistory();
                    }
                } catch (err) {
                    console.error("Помилка з'єднання:", err);
                }
            }, 500);
        }

        async function loadHistory() {
            try {
                const res = await fetch("http://localhost:5000/api/image/history");
                if (!res.ok) return;

                const historyData = await res.json();
                const container = document.getElementById("history-container");
                container.innerHTML = "";

                if (historyData.length === 0) {
                    container.innerHTML = "<div style='text-align:center; color:#6b7280; font-size:14px;'>Історія порожня</div>";
                    return;
                }

                historyData.forEach(item => {
                    const date = new Date(item.completedAt).toLocaleString("uk-UA");
                    const url = "http://localhost:5000" + item.resultImageUrl;

                    const card = `
                        <a href="${url}" target="_blank" class="history-card">
                            <img src="${url}" class="history-thumb" alt="Мініатюра" onerror="this.closest('.history-card').style.display='none'">
                            <div class="history-info">
                                <span class="history-filename">${item.originalFileName}</span>
                                <span class="history-date">${date}</span>
                            </div>
                        </a>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });
            } catch (err) {
                console.error("Помилка завантаження історії:", err);
            }
        }

        window.addEventListener("DOMContentLoaded", loadHistory);
    </script>
</body>
</html>
