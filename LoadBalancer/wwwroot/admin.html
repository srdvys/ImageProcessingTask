<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміністратора | Моніторинг серверів</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            padding: 20px;
            color: #333;
        }

        .header {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .status-completed {
            color: #28a745;
            font-weight: bold;
        }

        .status-processing {
            color: #fd7e14;
            font-weight: bold;
        }

        .status-cancelled {
            color: #dc3545;
            font-weight: bold;
        }

        .task-id {
            font-size: 0.8em;
            color: #888;
            font-family: monospace;
        }

        .port-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            font-size: 0.85em;
        }

        .port-5001 {
            background-color: #17a2b8;
        }

        .port-5002 {
            background-color: #6f42c1;
        }

        .port-none {
            background-color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Моніторинг навантаження серверів</h1>
    </div>

    <table>
        <thead>
            <tr>
                <th>Час</th>
                <th>Порт сервера</th>
                <th>ID Задачі</th>
                <th>Файл</th>
                <th>Статус</th>
                <th>Прогрес</th>
            </tr>
        </thead>
        <tbody id="tasksTableBody">
        </tbody>
    </table>

    <script>
        async function fetchAdminData() {
            try {
                const response = await fetch('/api/image/admin/tasks');
                if (!response.ok) return;

                const data = await response.json();
                const tbody = document.getElementById('tasksTableBody');
                tbody.innerHTML = '';

                data.tasks.forEach(task => {
                    let statusClass = 'status-processing';
                    let statusText = 'Обробляється';

                    if (task.status === 'Completed') { statusClass = 'status-completed'; statusText = 'Завершено'; }
                    else if (task.status === 'Cancelled') { statusClass = 'status-cancelled'; statusText = 'Скасовано'; }

                    let progressText = task.progress >= 0 ? task.progress + '%' : '-';

                    let portClass = 'port-none';
                    if (task.serverPort === 5001) portClass = 'port-5001';
                    if (task.serverPort === 5002) portClass = 'port-5002';
                    let portDisplay = task.serverPort ? task.serverPort : 'Невідомо';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                            <td>${task.createdAt}</td>
                            <td><span class="port-badge ${portClass}">${portDisplay}</span></td>
                            <td class="task-id">${task.id}</td>
                            <td>${task.fileName}</td>
                            <td class="${statusClass}">${statusText}</td>
                            <td>${progressText}</td>
                        `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Помилка оновлення адмінки:', error);
            }
        }

        setInterval(fetchAdminData, 2000);
        fetchAdminData();
    </script>
</body>
</html>
